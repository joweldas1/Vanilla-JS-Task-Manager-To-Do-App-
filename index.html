<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Page To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="todo-container">
            <div class="todo-header">
                <h2>Get Things Done <i class="fa-solid fa-bolt"></i></h2>
            </div>
            <div class="input-section">
                <input type="text" id="task-input" placeholder="What needs to be done?">
                <button id="add-btn" onclick="addTask()">Add Task</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all', event)">All</button>
                <button class="filter-btn" onclick="setFilter('active', event)">Active</button>
                <button class="filter-btn" onclick="setFilter('completed', event)">Completed</button>
            </div>
            <ul id="task-list"></ul>
            <div class="task-stats">
                <span id="task-count">0 items left</span>
                <button onclick="clearCompleted()">Clear Completed</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
